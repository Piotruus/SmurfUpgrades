# Szanse i mnożniki ceny pełnej (100%)
chances:
  25:
    price-multiplier: 0.25
  50:
    price-multiplier: 0.50
  100:
    price-multiplier: 1.00
starter:
  give-on-first-join: false
  auto-respawn-set: false

# Efekty po próbie ulepszenia (nazwy Bukkit/Paper 1.21.4)
effects:
  success:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    particle: HAPPY_VILLAGER
    count: 24
    title-enabled: true
    title: '&a&lULEPSZONO!'
    subtitle: '&fNowy poziom: {stars}'
  failure:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    particle: SMOKE
    count: 12
ranking:
  limit: 10
  header: '&b&l✦ TOP ULEPSZEŃ ✦'
legendary:
  item-name: '&5&l✦ &d{character} &5{stars} &5&l✦'
  lore:
    - '&8━━━━━━━━━━━━━━━━━━'
    - '&d✧ LEGENDARNY POZIOM ✧'
    - '&5Osiągnięto maksimum!'
  broadcast: true
  broadcast-message: '&5✦ &d{player} &7odblokował poziom {stars}&7!'

# Bonus do drewna przy ścinaniu siekierą AvengersUpgrades.
# 1.0 = zwykły drop, 2.0 = około 2x drewna, 3.0 = około 3x.
# Działa tylko na LOG/WOOD/STEM/HYPHAE i tylko w survival/adventure.
